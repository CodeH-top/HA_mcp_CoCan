name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate bundled card
        run: node --check custom_components/mcp_cocan/www/cocan-card.js
      - name: Validate and build integration
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/build_release.py --tag "$RELEASE_TAG"
          else
            python scripts/build_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcp_cocan
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp_cocan
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/mcp_cocan.zip dist/mcp_cocan.zip.sha256 --verify-tag --title "$RELEASE_TAG" --generate-notes
